<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>

<body>
  <div class="container">
      <div class="cardmain">

             <img src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall">

            <div class="name">Jessica Randall</div>
            <div class="location">London, United Kingdom</div>

              <p>"Front-end developer and avid reader."</p>
              
            <div class="linkwrap">
              <div class="link">GitHub</div>
              <div class="link">Frontend Mentor</div>
              <div class="link">LinkedIn</div>
              <div class="link">Twitter</div>
              <div class="link">Instagram</div>
            </div>
       </div>
  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Russ Humensky</a>.
  </footer>
</body>
</html>
